spring.application.name=nutriflow

# ---- Data layer: embedded H2 (in-memory, recreated on every restart) ----
spring.datasource.url=jdbc:h2:mem:nutriflowdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates/updates tables from the @Entity classes at startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Uncomment to see the SQL Hibernate runs
# spring.jpa.show-sql=true

# ---- H2 web console: http://localhost:8080/h2-console ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info

# ---- Demo account seeded at startup (matches the React frontend's "Try Demo Account") ----
nutriflow.demo.email=demo@nutriflow.app
nutriflow.demo.password=demo1234
nutriflow.demo.seed=true
